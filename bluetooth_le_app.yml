# Do not use recursive glob patterns unless really necessary!
extra_files:
  - bluetooth_le_app_templates.xml
  - bluetooth_le_app_demos.xml
  - documentation/slBluetooth_docContent.xml
hwfilter:
  device_tags:
    device_wlcsp: # WLCSP packages don't support channel sounding
      - efr32bg24b310f1536ij42
      - efr32bg24b410f1536ij42
  board_excludes:
    - brd1019a # Socket board
    - brd1021a # Socket board
    - brd2601a # Only B variant is supported, see comments in BG-10857
    - brd2705a # Other xg28 boards are supported, so it's probably a miss.
    - brd2900a # Laird Connectivity
    - brd2901a # Laird Connectivity
    - brd4197a # ZigBee only, see also BG-12446
    - brd4198b # Deprecated Channel Sounding board
    - brd4199b # Deprecated Channel Sounding board
    - brd4329a # Removed in BG-12446 but the justification is unclear.
    - brd4332a # Sidewalk-only, see also BG-15189
    - brd4335a # Deprecated Channel Sounding board
    - brd4356z # TBD
    - brd4406a # Deprecated Channel Sounding board
    - brd4411a # Deprecated Channel Sounding board
  device_excludes:
    - device_family_efr32sg28 # TBD
    - rm21z000f1024im32 # BRD4171A
    - efr32mr21a020f512im32 # RCP only, see IOTREQ-3978
  quality_excludes:
    - internal # Conan packages should not include components with internal quality, so this is just an extra protection.
toolchains:
  - gcc
  - iar
  - llvm
